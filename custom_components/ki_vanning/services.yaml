nullstill:
  name: Nullstill tellere
  description: Nullstiller forbruk, kalibrering eller begge deler.
  fields:
    hva:
      name: Hva
      description: alt, forbruk eller kalibrering
      default: alt
      selector:
        select:
          options: [alt, forbruk, kalibrering]

hent_plan:
  name: Hent programplan
  description: Leser programmene fra OpenSprinkler på nytt.

kjor:
  name: Kjør sone
  description: Slår på en ventil i et gitt antall minutter (egne ventiler).
  fields:
    sone:
      name: Sone
      description: Entitets-id eller navn på sonen
      selector: { text: }
    minutter:
      name: Minutter
      default: 10
      selector: { number: { min: 1, max: 180, mode: box } }

kjor_program:
  name: Kjør program
  description: Starter et program med en gang.
  fields:
    program:
      name: Program
      selector: { text: }

stopp:
  name: Stopp all vanning
  description: Tømmer køen og slår av ventilene.

lag_program:
  name: Lag eller endre program
  description: Lager et vanningsprogram, eller oppdaterer et som har samme navn.
  fields:
    navn:
      name: Navn
      required: true
      selector: { text: }
    tid:
      name: Klokkeslett
      default: "06:00"
      selector: { time: }
    dager:
      name: Ukedager
      description: man, tir, ons, tor, fre, lor, son – tomt hvis du bruker intervall
      selector: { select: { multiple: true, options: [man, tir, ons, tor, fre, lor, son] } }
    intervall:
      name: Hver N. dag
      description: 0 = bruk ukedager i stedet
      default: 0
      selector: { number: { min: 0, max: 30, mode: box } }
    start_dato:
      name: Startdato for intervallet
      selector: { date: }
    soner:
      name: Soner
      description: "Liste med {entity, min}, eller «switch.x:10, switch.y:5»"
      selector: { object: }
    samtidig:
      name: Kjør sonene samtidig
      default: false
      selector: { boolean: }
    ferie:
      name: Bare i feriemodus
      default: false
      selector: { boolean: }
    aktiv:
      name: Aktivt
      default: true
      selector: { boolean: }

slett_program:
  name: Slett program
  fields:
    navn:
      name: Navn
      required: true
      selector: { text: }

sett_regnpause:
  name: Sett regnpause
  description: Stopper programmene i et gitt antall timer. 0 fjerner pausen.
  fields:
    timer:
      name: Timer
      required: true
      example: 24
      selector: { number: { min: 0, max: 168, step: 1, mode: box, unit_of_measurement: t } }

nullstill_regnpause:
  name: Nullstill regnpause
  description: Fjerner regnpausen med en gang.

sett_anlegg:
  name: Slå anlegget av eller på
  description: Av stopper det som går, og hindrer at programmene starter.
  fields:
    pa:
      name: På
      selector: { boolean: }
